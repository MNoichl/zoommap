[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datamapplot-zoom"
version = "0.1.0"
description = "Zoom-dependent position keyframes through DataMapPlot's existing custom_js hook"
requires-python = ">=3.10"
dependencies = ["numpy>=2", "scipy>=1.11"]

[project.optional-dependencies]
notebook = [
    "datamapplot>=0.7.3", "pandas", "pillow", "requests",
    # Opinionated uses matplotlib.style.core, retained in Matplotlib 3.10.
    "matplotlib>=3.6,<3.11",
    "opinionated==0.0.3.0",
    # Opinionated 0.0.3.0 imports pkg_resources, provided by these setuptools versions.
    "setuptools>=68,<81",
    "scikit-learn", "sentence-transformers>=5,<6", "nbformat", "nbclient",
    "ipykernel", "jupyterlab",
]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zoommap = ["*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
